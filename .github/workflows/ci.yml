name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore GameStore.sln

      - name: Build
        run: dotnet build GameStore.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GameStore.sln --configuration Release --no-build --verbosity normal